name: pos_solosfly
description: "A comprehensive POS Cashier, Receipt Maker, PDF Exporter & Financial Analytics mobile app for Solosfly."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.19.0
  shared_preferences: ^2.2.3
  sqflite: ^2.3.3+1
  path: ^1.9.0
  path_provider: ^2.1.3
  pdf: ^3.10.8
  printing: ^5.13.1
  share_plus: ^9.0.0
  image_picker: ^1.1.1
  fl_chart: ^0.68.0
  provider: ^6.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
