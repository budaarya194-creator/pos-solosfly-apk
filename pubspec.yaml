name: pos_solosfly
description: "A comprehensive POS Cashier, Receipt Maker, PDF Exporter & Financial Analytics mobile app for Solosfly."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  shared_preferences: any
  sqflite: any
  path: any
  path_provider: any
  pdf: any
  printing: any
  share_plus: any
  image_picker: any
  fl_chart: any
  provider: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: any

flutter:
  uses-material-design: true
  assets:
    - assets/images/
